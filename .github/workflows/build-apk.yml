name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GIMP editor server
        run: |
          python3 -m py_compile server/gimp_editor/app.py
          bash -n server/gimp_editor/start_gimp_scriptfu.sh
          bash -n server/gimp_editor/install_staging.sh

      - name: Probe current GIMP endpoint
        shell: bash
        run: |
          set +e
          echo "=== 18083 CURRENT EDITOR ENDPOINT ==="
          curl -v --connect-timeout 8 --max-time 15 http://91.98.126.167:18083/health 2>&1
          echo "RC_18083=$?"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNB-Image-Editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
