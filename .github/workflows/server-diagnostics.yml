name: Server Diagnostics

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/server-diagnostics.yml"
      - "server/gimp_editor/**"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Professional editor endpoint
        shell: bash
        run: |
          set +e
          BASE="http://91.98.126.167:18083"

          echo "=== HEALTH ==="
          curl -v --connect-timeout 10 --max-time 20 "$BASE/health" 2>&1
          echo
          echo "HEALTH_RC=$?"

          echo
          echo "=== CAPABILITIES ==="
          curl -v --connect-timeout 10 --max-time 20 "$BASE/api/editor/capabilities" 2>&1
          echo
          echo "CAPABILITIES_RC=$?"

          echo
          echo "=== EXPECTED SERVICE ==="
          echo "UNB Pro Editor API on :18083"
