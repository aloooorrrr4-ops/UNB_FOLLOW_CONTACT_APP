name: Server Diagnostics

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/server-diagnostics.yml"
      - "server/gimp_editor/**"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify professional editor endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://91.98.126.167:18083"

          echo "=== HEALTH ==="
          HEALTH="$(curl --fail --show-error --silent "$BASE/health")"
          echo "$HEALTH"

          echo
          echo "=== CAPABILITIES ==="
          CAPS="$(curl --fail --show-error --silent "$BASE/api/editor/capabilities")"
          echo "$CAPS"

          echo
          echo "=== EXPECTED SERVICE ==="
          echo "UNB Pro Editor API on :18083"
