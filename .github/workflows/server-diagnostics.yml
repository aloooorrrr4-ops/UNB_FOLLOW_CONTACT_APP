name: Server Diagnostics

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/server-diagnostics.yml"
      - "server/gimp_editor/**"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify professional editor endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://91.98.126.167"

          echo "=== HEALTH ==="
          HEALTH="$(curl --fail --show-error --silent "$BASE/health")"
          echo "$HEALTH"

          echo
          echo "=== AUTH BOUNDARY ==="
          STATUS="$(curl --silent --output /tmp/caps.json --write-out '%{http_code}' "$BASE/api/editor/capabilities")"
          cat /tmp/caps.json
          echo
          if [ "$STATUS" != "401" ]; then
            echo "::error::Expected unauthenticated capabilities request to return 401, got $STATUS"
            exit 1
          fi

          echo
          echo "UNB Pro Editor is reachable and API authentication is enforced."
