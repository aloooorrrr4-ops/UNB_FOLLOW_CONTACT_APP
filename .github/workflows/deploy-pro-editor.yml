name: Deploy Pro Editor Server

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/deploy-pro-editor.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package
        run: |
          python3 -m py_compile server/gimp_editor/app.py
          bash -n server/gimp_editor/start_gimp_scriptfu.sh
          bash -n server/gimp_editor/install_staging.sh
          bash -n server/gimp_editor/setup_https_ip.sh

      - name: Check SSH deployment credential
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::GitHub secret SERVER_SSH_KEY is not configured."
            exit 2
          fi

      - name: Upload GIMP editor package
        uses: appleboy/scp-action@v1
        with:
          host: 91.98.126.167
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server/gimp_editor"
          target: "/tmp/unb-pro-editor-deploy"
          overwrite: true

      - name: Install and replace old service
        uses: appleboy/ssh-action@v1
        with:
          host: 91.98.126.167
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -e
            cd /tmp/unb-pro-editor-deploy/server/gimp_editor
            chmod +x install_staging.sh start_gimp_scriptfu.sh diagnose.sh
            ./install_staging.sh
            ./setup_https_ip.sh

      - name: Verify production endpoint
        run: |
          set -euo pipefail
          sleep 3
          curl --fail --show-error --silent https://91.98.126.167/health
          echo
          STATUS="$(curl --silent --output /tmp/caps.json --write-out '%{http_code}' https://91.98.126.167/api/editor/capabilities)"
          cat /tmp/caps.json
          echo
          test "$STATUS" = "401"
