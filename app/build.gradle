plugins {
    id 'com.android.application'
}

android {
    namespace 'com.unb.imageeditor'
    compileSdk 35

    defaultConfig {
        applicationId "com.unb.imageeditor"
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName "0.8.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
