plugins {
    id 'com.android.application'
}

android {
    namespace 'com.unb.imageeditor'
    compileSdk 35

    defaultConfig {
        applicationId "com.unb.imageeditor"
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName "1.0.2-alpha-pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
